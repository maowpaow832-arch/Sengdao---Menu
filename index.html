<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>ແສງດາວ ປີ້ງຫູໝູ – ເມນູ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#fff1bd;--g2:#e9b94a;--g3:#b07d1c;--dim:#6a5424;--tx:#ecdcb0;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(var(--sat) + 70px)}
body{font-family:'Noto Sans Lao',sans-serif;color:var(--tx);min-height:100vh;
padding:0 calc(14px + var(--sar)) calc(40px + var(--sab)) calc(14px + var(--sal));position:relative;overflow-x:hidden;
background:radial-gradient(ellipse 55% 28% at 0 0,#e9b94a26,transparent),radial-gradient(ellipse 45% 25% at 100% 100%,#e9b94a1a,transparent),
repeating-linear-gradient(115deg,#0a0a0a 0 60px,#0e0d0b 60px 61px,#080808 61px 140px),#070707}
.gold{background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sw{position:absolute;left:0;top:0;width:min(46vw,380px);height:240px;pointer-events:none}
.edge{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:30;background:linear-gradient(90deg,transparent,var(--g3),var(--g1),var(--g3),transparent);padding-bottom:var(--sab)}
.wrap{max-width:1000px;margin:auto;position:relative}
header{display:flex;justify-content:flex-end;padding:calc(26px + var(--sat)) 4px 18px}
.brand{text-align:right}
.brand h1{font-size:clamp(44px,10vw,74px);font-weight:700;line-height:1.15;filter:drop-shadow(0 0 14px #e9b94a77)}
.brand h1 b{font-size:.5em;vertical-align:top;color:var(--g1);-webkit-text-fill-color:var(--g1);text-shadow:0 0 12px #ffd86b;margin-right:6px}
.brand p{display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:clamp(16px,3.4vw,22px);color:var(--g1);margin-top:2px}
.brand p::before{content:"";width:54px;height:2px;background:linear-gradient(90deg,transparent,var(--g2))}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:12px;justify-content:center;padding:calc(10px + var(--sat)) 0 12px;margin:0 -14px;background:linear-gradient(#070707f2 70%,#07070700)}
.tab{font:inherit;font-size:18px;font-weight:600;cursor:pointer;padding:9px 26px;border-radius:30px;background:#0b0b0b;border:1.5px solid var(--dim);color:#a98a45;opacity:.75;transition:.2s}
.tab[aria-selected=true]{opacity:1;color:var(--g1);border-color:var(--g2);box-shadow:0 0 0 3px #0b0b0b,0 0 0 4px var(--g3),0 0 18px #e9b94a88,inset 0 0 14px #e9b94a33}
.tab:focus-visible,.card:focus-visible,.back:focus-visible{outline:2px solid var(--g1);outline-offset:3px}
.panel{background:linear-gradient(#0b0b0b,#050505);border:2px solid var(--g2);border-radius:16px;padding:12px 12px 16px;position:relative;margin-top:6px;box-shadow:0 0 30px #e9b94a22,inset 0 0 40px #000}
.panel::before{content:"";position:absolute;inset:5px;border:1px solid var(--dim);border-radius:12px;pointer-events:none}
.panel>i{position:absolute;width:11px;height:11px;background:var(--g1);transform:rotate(45deg);z-index:2;box-shadow:0 0 8px var(--g2)}
.panel>i:nth-of-type(1){left:-7px;top:-7px}.panel>i:nth-of-type(2){right:-7px;top:-7px}.panel>i:nth-of-type(3){left:-7px;bottom:-7px}.panel>i:nth-of-type(4){right:-7px;bottom:-7px}
.sh{position:relative;display:flex;align-items:center;gap:14px;height:84px;padding-left:10px;margin:8px 8px 14px}
.sh svg.fr{position:absolute;inset:0;width:100%;height:100%}
.ico{position:relative;width:62px;height:62px;border:2px solid var(--g2);border-radius:50%;display:grid;place-items:center;background:#0a0a0a;flex:none}
.ico svg{width:30px;height:30px;fill:var(--g2)}
.st{position:relative;text-align:center;flex:1;padding-right:26px}
.st h2{font-weight:700;font-size:clamp(28px,6vw,38px);line-height:1.2}
.st small{font-size:15px;letter-spacing:.28em;color:#f6ecd0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 6px}
.card{font:inherit;color:inherit;text-align:center;cursor:pointer;background:linear-gradient(#0d0d0d,#060606);border:1.5px solid var(--g2);border-radius:12px;padding:8px 8px 12px;position:relative;transition:transform .2s,box-shadow .2s}
.card::before{content:"";position:absolute;inset:3px;border:1px solid #3d3014;border-radius:9px;pointer-events:none}
.card:hover{transform:translateY(-2px);box-shadow:0 0 18px #e9b94a44}
.pf{position:relative;aspect-ratio:1/1;border:1.5px solid var(--g3);border-radius:8px;background:radial-gradient(circle at 50% 40%,#2a210f,#0a0804);display:grid;place-items:center;overflow:hidden;margin-bottom:10px}
.pf img{max-width:92%;max-height:92%;object-fit:contain;display:block;opacity:0;transition:opacity .4s}
.pf img.on{opacity:1}
.pf img.round{width:86%;height:86%;max-width:none;max-height:none;object-fit:cover;border-radius:50%;border:2px solid var(--g2)}
.pf .em{font-size:48px;position:absolute}
.nm{font-size:clamp(15px,3.6vw,19px);font-weight:600;line-height:1.35;color:var(--g1);min-height:2.7em;display:flex;align-items:center;justify-content:center;word-break:break-word}
.pr{font-size:clamp(14px,3.3vw,17px);font-weight:500;color:var(--g2);margin-top:6px;padding-top:6px;position:relative}
.pr::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--g2),transparent)}
.msg{grid-column:1/-1;text-align:center;padding:40px 10px;color:#c9b27a;font-size:17px}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(18px + var(--sat)) 16px calc(18px + var(--sab));background:#000000b8;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ov.on{display:flex}
.box{position:relative;width:min(100%,520px);max-height:100%;overflow:auto;text-align:center;padding:56px 22px 24px;border:2px solid var(--g2);border-radius:20px;background:linear-gradient(rgba(255,160,80,.16),rgba(255,140,60,.07));box-shadow:0 0 40px #e9b94a44}
.box::before{content:"";position:absolute;inset:6px;border:1px solid var(--g3);border-radius:15px;pointer-events:none}
.back{position:absolute;left:16px;top:14px;font:inherit;font-size:17px;font-weight:600;color:var(--g1);background:#0a0a0acc;border:1.5px solid var(--g2);border-radius:20px;padding:5px 16px;cursor:pointer;z-index:2}
.big{min-height:200px;display:grid;place-items:center}
.big img{max-width:100%;max-height:52vh;object-fit:contain;display:block;filter:drop-shadow(0 10px 22px #000a)}
.big img.round{width:min(100%,360px);aspect-ratio:1;max-height:none;object-fit:cover;border-radius:50%;border:3px solid var(--g2)}
.big .em{font-size:96px}
.box h3{font-size:clamp(26px,6vw,34px);font-weight:700;margin-top:16px;line-height:1.35}
.box .p{font-size:clamp(20px,4.5vw,26px);color:var(--g1);font-weight:600;margin-top:6px}
@media(min-width:700px){.grid{gap:20px}.card{padding:10px 10px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg class="sw" viewBox="0 0 380 240" fill="none" aria-hidden="true"><defs><linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff1bd"/><stop offset=".5" stop-color="#e9b94a"/><stop offset="1" stop-color="#b07d1c" stop-opacity="0"/></linearGradient></defs><path d="M0 150C70 118 140 52 280 0" stroke="url(#s)" stroke-width="2.5"/><path d="M0 185C85 140 160 80 330 0" stroke="url(#s)" stroke-width="1" opacity=".6"/><path d="M0 105C45 85 105 38 175 0" stroke="url(#s)" stroke-width="3.5" opacity=".85"/></svg>
<div class="edge"></div>
<div class="wrap">
  <header><div class="brand"><h1 class="gold"><b>✦</b>ແສງດາວ</h1><p>ປີ້ງຫູໝູ</p></div></header>
  <nav class="tabs" role="tablist" aria-label="ໝວດເມນູ">
    <button class="tab" role="tab" data-cat="food" aria-selected="true">🍽️ ອາຫານ</button>
    <button class="tab" role="tab" data-cat="drink" aria-selected="false">🥤 ເຄື່ອງດື່ມ</button>
  </nav>
  <section class="panel" aria-live="polite"><i></i><i></i><i></i><i></i>
    <div class="sh">
      <svg class="fr" viewBox="0 0 400 84" preserveAspectRatio="none" aria-hidden="true"><path d="M42 2H350L396 42L350 82H42A40 40 0 0 1 42 2Z" fill="none" stroke="#e9b94a" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M42 7H346L388 42L346 77H42" fill="none" stroke="#6a5424" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
      <div class="ico" id="ico"></div>
      <div class="st"><h2 class="gold" id="hl"></h2><small id="he"></small></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="ລາຍລະອຽດເມນູ">
  <div class="box" id="box">
    <button class="back" id="back">← ກັບຄືນ</button>
    <div class="big" id="big"></div>
    <h3 class="gold" id="dn"></h3>
    <div class="p" id="dp"></div>
  </div>
</div>

<script>
const EXT=/\.(jpe?g|jfif|png|webp|gif|avif)$/i;
const CATS={
  food:{lo:'ອາຫານ',en:'FOOD',em:'🍽️',ico:'<svg viewBox="0 0 30 30"><path d="M6 3h2v9h1V3h2v9h1V3h2v10c0 2-1 3-3 3v11H9V16C7 16 6 15 6 13zM21 3c3 0 5 5 5 10 0 3-2 5-3 5v9h-2z"/></svg>'},
  drink:{lo:'ເຄື່ອງດື່ມ',en:'DRINKS',em:'🥤',ico:'<svg viewBox="0 0 30 30"><path d="M14 2h8v2h-6v4h9l-2 20H8L6 8h8zM9 11l1.4 15h9.2L21 11z"/></svg>'}
};
const $=s=>document.querySelector(s);
let items=[],cat='food',lastFocus=null;

function parse(file){
  let base=file.replace(EXT,'').trim();
  const drink=/^a-/i.test(base);
  if(drink)base=base.replace(/^a-/i,'');
  let name=base,price='';
  const m=base.match(/^(.*?)\s*(\d[\d,.]*)\s*(?:ກີບ|kip|lak)?\s*$/i);
  if(m&&m[1].trim()){
    name=m[1].trim();
    const digits=m[2].replace(/\D/g,'');
    if(digits)price=Number(digits).toLocaleString('en-US')+' ກີບ';
  }
  return{file,name,price,cat:drink?'drink':'food',src:'menu/'+encodeURIComponent(file)};
}
const sortFn=(a,b)=>a.file.localeCompare(b.file,'lo',{numeric:true});

async function listFiles(){
  const h=location.hostname;
  if(h.endsWith('.github.io')){
    try{
      const owner=h.split('.')[0];
      const seg=location.pathname.split('/')[1];
      const repo=(!seg||/\.html?$/i.test(seg))?h:seg;
      const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/menu`);
      if(r.ok){const j=await r.json();if(Array.isArray(j))return j.filter(f=>f.type==='file'&&EXT.test(f.name)).map(f=>f.name)}
    }catch(e){}
  }
  const r=await fetch('menu.json?'+Date.now());
  if(!r.ok)throw new Error('menu.json');
  const j=await r.json();
  return j.filter(n=>typeof n==='string'&&EXT.test(n));
}

/* ລົບພື້ນຂາວ: flood-fill ຈາກຂອບຮູບ */
function cleanImage(img){
  try{
    const K=Math.min(1,700/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*K)),h=Math.max(1,Math.round(img.naturalHeight*K));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
    const d=x.getImageData(0,0,w,h),p=d.data;
    const bg=i=>p[i+3]<12||(p[i+3]>200&&Math.min(p[i],p[i+1],p[i+2])>232);
    let b=0,n=0;
    const chk=(px,py)=>{n++;if(bg((py*w+px)*4))b++};
    for(let i=0;i<w;i++){chk(i,0);chk(i,h-1)}
    for(let j=0;j<h;j++){chk(0,j);chk(w-1,j)}
    if(b/n<.7)return null;
    const seen=new Uint8Array(w*h),st=[];
    const push=(px,py)=>{const q=py*w+px;if(!seen[q]&&bg(q*4)){seen[q]=1;st.push(q)}};
    for(let i=0;i<w;i++){push(i,0);push(i,h-1)}
    for(let j=0;j<h;j++){push(0,j);push(w-1,j)}
    while(st.length){
      const q=st.pop(),px=q%w,py=(q/w)|0;p[q*4+3]=0;
      if(px>0)push(px-1,py);if(px<w-1)push(px+1,py);if(py>0)push(px,py-1);if(py<h-1)push(px,py+1);
    }
    /* ເກັບຂອບໃຫ້ນຸ່ມ */
    const soft=[];
    for(let q=0;q<w*h;q++){
      if(seen[q])continue;
      const px=q%w,py=(q/w)|0;
      if((px>0&&seen[q-1])||(px<w-1&&seen[q+1])||(py>0&&seen[q-w])||(py<h-1&&seen[q+w]))soft.push(q);
    }
    for(const q of soft){
      const i=q*4,m=Math.min(p[i],p[i+1],p[i+2]);
      p[i+3]=Math.round(p[i+3]*Math.max(0,Math.min(1,(236-m)/46)));
    }
    let x0=w,y0=h,x1=-1,y1=-1;
    for(let py=0;py<h;py++)for(let px=0;px<w;px++){
      if(p[(py*w+px)*4+3]>24){if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
    }
    if(x1<0)return null;
    x.putImageData(d,0,0);
    const pad=4;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
    const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;
    o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
    return o.toDataURL('image/png');
  }catch(e){return null}
}

function loadImage(it){
  if(it.p)return it.p;
  it.p=new Promise(res=>{
    const im=new Image();
    im.onload=()=>{const u=cleanImage(im);res(u?{src:u,round:false}:{src:it.src,round:true})};
    im.onerror=()=>res(null);
    im.src=it.src;
  });
  return it.p;
}
function paint(box,res,alt,emoji){
  box.innerHTML='';
  if(!res){const e=document.createElement('span');e.className='em';e.textContent=emoji;box.appendChild(e);return}
  const im=document.createElement('img');im.alt=alt;im.src=res.src;if(res.round)im.className='round';
  box.appendChild(im);requestAnimationFrame(()=>im.classList.add('on'));
}

function render(){
  const C=CATS[cat];
  $('#hl').textContent=C.lo;$('#he').textContent=C.en;$('#ico').innerHTML=C.ico;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.cat===cat));
  const g=$('#grid');g.innerHTML='';
  const list=items.filter(i=>i.cat===cat);
  if(!list.length){g.innerHTML='<div class="msg">ຍັງບໍ່ມີເມນູໃນໝວດນີ້</div>';return}
  list.forEach(it=>{
    const b=document.createElement('button');b.className='card';b.type='button';
    b.innerHTML='<div class="pf"><span class="em">'+C.em+'</span></div><div class="nm"></div>'+(it.price?'<div class="pr"></div>':'');
    b.querySelector('.nm').textContent=it.name;
    if(it.price)b.querySelector('.pr').textContent=it.price;
    b.onclick=()=>openDetail(it,b);
    g.appendChild(b);
    const pf=b.querySelector('.pf');
    loadImage(it).then(r=>{if(r)paint(pf,r,it.name,C.em);else pf.innerHTML='<span class="em">'+C.em+'</span>'});
  });
}

function openDetail(it,from){
  lastFocus=from;
  $('#dn').textContent=it.name;$('#dp').textContent=it.price;
  const big=$('#big');big.innerHTML='';
  loadImage(it).then(r=>paint(big,r,it.name,CATS[it.cat].em));
  $('#ov').classList.add('on');document.body.style.overflow='hidden';$('#back').focus();
}
function closeDetail(){
  $('#ov').classList.remove('on');document.body.style.overflow='';
  if(lastFocus)lastFocus.focus({preventScroll:true});
}
$('#back').onclick=closeDetail;
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))closeDetail()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cat=t.dataset.cat;render()});

(async()=>{
  $('#grid').innerHTML='<div class="msg">ກຳລັງໂຫຼດເມນູ...</div>';
  $('#hl').textContent=CATS.food.lo;$('#he').textContent=CATS.food.en;$('#ico').innerHTML=CATS.food.ico;
  try{
    items=(await listFiles()).sort((a,b)=>a.localeCompare(b,'lo',{numeric:true})).map(parse);
    render();
  }catch(e){
    $('#grid').innerHTML='<div class="msg">ໂຫຼດເມນູບໍ່ໄດ້ ກະລຸນາລອງໃໝ່ອີກຄັ້ງ</div>';
  }
})();
</script>
</body>
</html>
